name: Docker Hub

# Builds the Docker image for linux/amd64 and linux/arm64 and pushes it to
# Docker Hub (gjssss/magpie) on every push to main — i.e. every time upstream
# yetone/magpie is merged in — plus on manual dispatch.
#
# Kept as a separate file on purpose: upstream's docker.yml (GHCR) is left
# untouched so merging upstream never conflicts here.
#
# Needs two repository secrets on this fork (Settings → Secrets and
# variables → Actions → New repository secret):
#   DOCKERHUB_USERNAME = gjssss
#   DOCKERHUB_TOKEN    = a Docker Hub Personal Access Token with
#                        Read & Write permissions (Account Settings →
#                        Security → New Access Token). Never use the account
#                        password here.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: docker.io/gjssss/magpie

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    # native arm runner instead of QEMU, same as docker.yml
    runs-on: ${{ startsWith(matrix.platform, 'linux/arm') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          outputs: |
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=dockerhub-${{ matrix.platform }}
          cache-to: type=gha,scope=dockerhub-${{ matrix.platform }},mode=max

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest and tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DIGEST_ARGS=()
          for d in *; do DIGEST_ARGS+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$SHORT_SHA" \
            "${DIGEST_ARGS[@]}"
          docker buildx imagetools inspect "$IMAGE:latest"
